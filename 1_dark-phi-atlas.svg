<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" fill="none">
  <!-- Central Vertical Pillar (5.0px Pure White Axis) -->
  <line x1="50" y1="7" x2="50" y2="93" stroke="#FFFFFF" stroke-width="5.0" stroke-linecap="round"/>

  <!-- Outer Circle Manifold (Warm Ochre R=32) -->
  <path d="M 43.5 18.6 A 32 32 0 0 0 43.5 81.4" stroke="#9C784A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 56.5 18.6 A 32 32 0 0 1 56.5 81.4" stroke="#9C784A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Inner Elliptical Manifold (Eccentricity A: rx=30, ry=19) -->
  <path d="M 43.5 31.6 A 30 19 0 0 0 43.5 68.4" stroke="#D4AF37" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 56.5 31.6 A 30 19 0 0 1 56.5 68.4" stroke="#D4AF37" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Dashed Equator Coordinate Line -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#D4AF37" stroke-width="2.4" stroke-dasharray="3.2 2.4"/>

  <!-- Equatorial Outer Boundary Nodes -->
  <circle cx="20" cy="50" r="3.0" fill="#9C784A"/>
  <circle cx="80" cy="50" r="3.0" fill="#9C784A"/>

  <!-- Invariant Center Origin Node -->
  <circle cx="50" cy="50" r="4.6" fill="#D4AF37"/>
</svg>
