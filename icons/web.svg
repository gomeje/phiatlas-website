<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Subtle Outer Hairline Rim -->
  <circle cx="50" cy="50" r="49" fill="#1C1917"/>
  <!-- Gold Ring -->
  <circle cx="50" cy="50" r="48" fill="#D4AF37"/>
  <!-- Inner Hairline Border -->
  <circle cx="50" cy="50" r="39.5" fill="#1C1917"/>
  <!-- Obsidian Center Disc -->
  <circle cx="50" cy="50" r="38.5" fill="#131110"/>

  <!-- Clean Vector Globe Geometry (No Winding Conflicts) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Globe Boundary -->
    <circle cx="50" cy="50" r="23" stroke-width="3"/>
    <!-- Central Latitude Equator -->
    <line x1="27" y1="50" x2="73" y2="50" stroke-width="2.6"/>
    <!-- North/South Parallels -->
    <path d="M 33 38 Q 50 43 67 38" stroke-width="2.4"/>
    <path d="M 33 62 Q 50 57 67 62" stroke-width="2.4"/>
    <!-- Prime & Secondary Longitude Meridians -->
    <ellipse cx="50" cy="50" rx="11" ry="23" stroke-width="2.6"/>
    <line x1="50" y1="27" x2="50" y2="73" stroke-width="2.6"/>
  </g>
</svg>
